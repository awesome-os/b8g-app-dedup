name: Release — Train & Publish Offline App Deduplicator .b8p
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Train Fresh app-paths.b8p & Verify Read-Only Scanner
        run: |
          node src/cli.mts train
          node --test src/app-dedup.test.mts
          sha256sum dist/app-paths.b8p > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/app-paths.b8p dist/SHA256SUMS.txt --title "b8g-app-dedup $TAG (41.2 KB INT8 .b8p)" --notes "Trained and verified automatically on GitHub Actions runner." || gh release upload "$TAG" dist/app-paths.b8p dist/SHA256SUMS.txt --clobber
