name: Release (via holo-compiler)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  release:
    uses: awesome-os/holo-compiler/.github/workflows/reusable-release.yml@main
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
      build-cmd: "node src/cli.mts train && node --test src/app-dedup.test.mts"
      artifact-glob: "src/dist/app-paths.b8p"
      sha-dir: "src/dist"
